# Kit-level CI for GitHub — the GitHub-native equivalent of the root .gitlab-ci.yml
# governance gate. Runs the template's validators + unit tests + knowledge-graph
# smoke test. The scripts resolve their own repo root, so they scope to template/
# regardless of CWD. (template/.github/workflows/ governs a *generated* project;
# this file governs the kit repo itself.)
name: ai-governance

on:
  push:
  pull_request:

jobs:
  ai-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet "pyyaml>=6"

      - name: Installer unit tests (brownfield adoption)
        run: |
          python3 scripts/install/tests/test_manifest.py
          python3 scripts/install/tests/test_merge.py
          python3 scripts/install/tests/test_harness.py
          python3 scripts/install/tests/test_plan.py
          python3 template/scripts/tests/test_harness_copilot.py
      - name: Installer end-to-end (greenfield, brownfield, idempotency, uninstall)
        run: python3 scripts/install/tests/test_adopt.py

      - name: Validate Agent Skills (agentskills.io)
        run: python3 template/scripts/validate-skills.py
      - name: Validate doc frontmatter contract (AGENTS.md §4.2)
        run: python3 template/scripts/validate-frontmatter.py
      - name: Validate session lifecycle-moments manifest
        run: python3 template/scripts/validate-moments.py
      - name: Validator unit tests
        run: python3 template/scripts/tests/test_validate_moments.py
      - name: Validate per-seat profiles manifest
        run: python3 template/scripts/validate-seat-profiles.py
      - name: Seat-profiles validator unit tests
        run: python3 template/scripts/tests/test_validate_seat_profiles.py

      - name: Knowledge-graph unit tests
        run: |
          python3 template/scripts/knowledge/tests/test_graph_store.py
          python3 template/scripts/knowledge/tests/test_manifest.py
          python3 template/scripts/knowledge/tests/test_ingest_docs.py
          python3 template/scripts/knowledge/tests/test_ingest_code.py
          python3 template/scripts/knowledge/tests/test_link_commits.py
          python3 template/scripts/knowledge/tests/test_query.py
          python3 template/scripts/knowledge/tests/test_ingest.py
          python3 template/scripts/knowledge/tests/test_mcp_server.py
          python3 template/scripts/knowledge/tests/test_end_to_end.py
          python3 template/scripts/knowledge/tests/test_ingest_issues.py
          python3 template/scripts/knowledge/tests/test_link_issues.py
          python3 template/scripts/knowledge/tests/test_issue_chain.py
          python3 template/scripts/jira/tests/test_export_jira.py

      - name: Consumption/ROI unit tests (token-roi theme)
        run: |
          python3 template/dashboard/tests/test_schema.py
          python3 template/dashboard/tests/test_roi.py
          python3 template/scripts/spend/tests/test_parse_transcript.py
          python3 template/scripts/spend/tests/test_collect_usage.py
          python3 template/scripts/spend/tests/test_import_invoice.py
          python3 template/scripts/spend/tests/test_import_api_usage.py
          python3 template/scripts/spend/tests/test_import_tickets.py
          python3 template/scripts/spend/tests/test_export_sessions.py
          python3 template/scripts/spend/tests/test_import_sessions.py
          python3 template/scripts/tests/test_check_brief_churn.py

      - name: Brief-churn gate (token-economy rule 2)
        run: python3 template/scripts/check-brief-churn.py --path template/AGENTS.md
      - name: Compile dashboard app
        run: python3 -m py_compile template/dashboard/app.py

      - name: Knowledge graph build + traceability smoke
        run: |
          python3 template/scripts/knowledge/ingest.py --build
          python3 template/scripts/knowledge/ingest.py --federated --trace ADR-0001 | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('nodes'), 'empty trace chain'; print('trace OK:', len(d.get('nodes')), 'nodes')"
          python3 template/scripts/knowledge/ingest.py --federated --trace issue:PROJ-1 | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('nodes'), 'empty issue trace'; print('issue trace OK:', len(d['nodes']), 'nodes')"

  # Adopt the kit end to end, as a client would: install into an empty repo, commit,
  # then run the generated project's governance gate on a FRESH CLONE (what a client's
  # CI sees; before H1 the gate failed on every clone), check doctor's drift section,
  # and prove a re-run changes nothing. Plan: Task H6 in
  # docs/roadmap/2026-10-07-phase-0-foundations-plan.md. The extra `standard, jenkins` leg
  # installs only the Jenkins gate (`--ci jenkins`, Tasks H8/H9); the profile legs install both.
  adopt-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, standard, full]
        # `default` passes no --ci (both gates). `ci` must be a matrix key: an include
        # that only adds a new key is merged into the matching leg, not added as a job.
        ci: [default]
        include:
          - profile: standard
            ci: jenkins
    env:
      PROFILE: ${{ matrix.profile }}
      # Empty on the default legs. Not `CI`: Actions sets CI=true.
      CI_GATE: ${{ matrix.ci != 'default' && matrix.ci || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet "pyyaml>=6"

      - name: Throwaway git identity
        run: |
          set -euo pipefail
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Adopt the kit into an empty repo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proj"
          ./install.sh --into "$RUNNER_TEMP/proj" --profile "$PROFILE" --yes --harness copilot-cli \
            ${CI_GATE:+--ci "$CI_GATE"}

      - name: Only the chosen CI gate is installed (H8, H9)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proj"
          test -f ci/Jenkinsfile.ai-governance
          if [ "$CI_GATE" = jenkins ]; then
            test ! -e .github/workflows    # no GitHub workflow at all, docs check included
          else
            test -f .github/workflows/ai-governance.yml
            # The docs link check is GitHub-only and ships from 'standard' up.
            if [ "$PROFILE" = minimal ]; then test ! -e .github/workflows/docs.yml
            else test -f .github/workflows/docs.yml; fi
          fi

      - name: Commit the adoption; generated Copilot files are tracked (H1)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proj"
          git init -q && git add -A && git commit -qm "adopt kit"
          git ls-files --error-unmatch .vscode/settings.json .github/copilot-instructions.md

      # Runs the Jenkinsfile's own sh '''...''' block with `sh -e`, as Jenkins does. On the
      # jenkins leg an empty venv comes first on PATH, so `python3` cannot import yaml and
      # the script must take its venv fallback (PEP 668 agents; Task H9).
      - name: Fresh clone runs the generated governance gate (ci/Jenkinsfile.ai-governance)
        run: |
          set -euo pipefail
          git clone -q "$RUNNER_TEMP/proj" "$RUNNER_TEMP/clone"
          cd "$RUNNER_TEMP/clone"
          sed -n "/sh '''/,/'''/p" ci/Jenkinsfile.ai-governance | sed '1d;$d' > "$RUNNER_TEMP/gate.sh"
          if [ "$CI_GATE" = jenkins ]; then
            python3 -m venv "$RUNNER_TEMP/no-yaml"
            export PATH="$RUNNER_TEMP/no-yaml/bin:$PATH"
            if python3 -c 'import yaml' 2>/dev/null; then echo "no-yaml venv imports yaml"; exit 1; fi
          fi
          sh -e "$RUNNER_TEMP/gate.sh"
          if [ "$CI_GATE" = jenkins ]; then test -d .venv-ai-governance
          else test ! -e .venv-ai-governance; fi
          test -z "$(git status --porcelain)"    # the venv is gitignored

      - name: Fresh clone has no generated-surface drift (doctor)
        run: |
          set -euo pipefail
          # doctor exits 1 on a fresh install because the template's <PLACEHOLDERS>
          # are unfilled by design. Allow 0 or 1, and gate on the drift section only.
          rc=0
          out="$(./install.sh --into "$RUNNER_TEMP/clone" doctor)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -gt 1 ]; then echo "doctor failed to run (exit $rc)"; exit 1; fi
          printf '%s\n' "$out" | grep -A1 '^Generated-surface drift$' | tail -n1 | grep -q '^  none '

      - name: Fresh clone runs the generated GitHub workflow (.github/workflows/ai-governance.yml)
        if: matrix.ci != 'jenkins'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/clone"
          # Run each `run:` step of the generated workflow in order (`uses:` steps are skipped);
          # stop at the first failure. Plan: Task H7.
          python3 - <<'EOF'
          import subprocess, sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ai-governance.yml"))
          for step in wf["jobs"]["governance"]["steps"]:
              if "run" not in step:
                  continue
              print(f"::group::{step['name']}", flush=True)
              rc = subprocess.run(["bash", "-euo", "pipefail", "-c", step["run"]]).returncode
              print("::endgroup::", flush=True)
              if rc:
                  sys.exit(f"FAILED: {step['name']} (exit {rc})")
          EOF

      # No --ci here: the choice recorded in the manifest must hold, so a re-added
      # workflow on the jenkins leg would show up below (H8).
      - name: Re-running the installer changes nothing
        run: |
          set -euo pipefail
          ./install.sh --into "$RUNNER_TEMP/proj" --profile "$PROFILE" --yes --harness copilot-cli
          # Every run stamps the manifest's "installed_at"; that one line may change.
          changes="$(git -C "$RUNNER_TEMP/proj" status --porcelain -- . ':!.ai-sdlc/manifest.json')"
          if [ -n "$changes" ]; then printf 'Re-run changed the repo:\n%s\n' "$changes"; exit 1; fi
          git -C "$RUNNER_TEMP/proj" diff --exit-code -I '"installed_at":' -- .ai-sdlc/manifest.json
